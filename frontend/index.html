<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Store</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <h1>My Store</h1>
    <span id="status" class="status">checking API…</span>
  </header>

<main>
  <!-- Product Section -->
  <section id="products" class="grid" aria-live="polite">
    <p class="muted">Loading products...</p>
  </section>

  <!-- Shopping Cart Section -->
  <section class="cart-section">
    <h2>Shopping Cart (<span id="cart-count">0</span>)</h2>

    <div id="cart-items">
      <p class="muted">Your cart is empty.</p>
    </div>

    <div class="cart-summary">
      <h3>Total: <span id="cart-total">$0.00</span></h3>
    </div>
  </section>
</main>


  <footer class="footer">
    <span id="served-by" class="muted"></span>
  </footer>

  <script src="app.js"></script>
</body>
</html>
